<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#fff7ed">
  <title>ゆでたまSNS</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ゆでたまSNS">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=44">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=44">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=44">
  <link rel="manifest" href="site.webmanifest?v=44">
  <style>
    .hidden{display:none!important}
    #loadingView{position:fixed;inset:0;z-index:9999;background:#fff}
  </style>
  <link rel="stylesheet" href="styles.css?v=44">
</head>
<body>
  <div id="appShell">
    <section id="loadingView" class="loading-screen">
      <div class="egg-loader" aria-label="読み込み中">
        <div class="egg-shadow"></div>
        <div class="egg-body">
          <div class="egg-yolk"></div>
        </div>
      </div>
      <div class="loading-text">ゆでたまSNS</div>
    </section>

    <section id="authView" class="auth-screen hidden" hidden>
      <div class="auth-bg"></div>
      <div class="auth-card-wrap">
        <div class="brand-hero compact-brand">
          <div class="egg-icon" aria-hidden="true"><svg viewBox="0 0 48 48" role="img"><ellipse cx="24" cy="24" rx="17" ry="20" fill="#fff" stroke="#cfd9de" stroke-width="2"/><circle cx="24" cy="25" r="8" fill="#f4b400"/><circle cx="21" cy="22" r="2.2" fill="#ffd45c" opacity=".95"/></svg></div>
          <div class="brand-copy">
            <h1>ゆでたまSNS</h1>
          </div>
        </div>

        <div class="auth-card glass">
          <div class="segmented">
            <button id="loginTab" class="active">ログイン</button>
            <button id="registerTab">新規登録</button>
          </div>

          <form id="loginForm" class="form modern-form">
            <label>
              <span>名前</span>
              <input id="loginName" autocomplete="username" maxlength="30" placeholder="表示名" required>
            </label>
            <label>
              <span>4桁PIN</span>
              <input id="loginPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" type="password" placeholder="1234" required>
            </label>
            <button class="primary" type="submit">ログインする</button>
          </form>

          <form id="registerForm" class="form modern-form hidden">
            <label>
              <span>表示名</span>
              <input id="registerName" maxlength="30" placeholder="ニックネーム" required>
            </label>
            <label>
              <span>4桁PIN</span>
              <input id="registerPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" type="password" placeholder="1234" required>
            </label>
            <button class="primary" type="submit">登録してはじめる</button>
          </form>

          <p id="authMsg" class="message"></p>
        </div>
      </div>
    </section>

    <section id="mainView">
      <header class="topbar glass">
        <div class="topbar-left">
          <div class="egg-icon" aria-hidden="true"><svg viewBox="0 0 48 48" role="img"><ellipse cx="24" cy="24" rx="17" ry="20" fill="#fff" stroke="#cfd9de" stroke-width="2"/><circle cx="24" cy="25" r="8" fill="#f4b400"/><circle cx="21" cy="22" r="2.2" fill="#ffd45c" opacity=".95"/></svg></div>
          <div>
            <h2>ゆでたまSNS</h2>
          </div>
        </div>
      </header>

      <main>
        <section id="homePage" class="page">
          <div id="pullRefresh" class="pull-refresh" aria-hidden="true">
            <div class="pull-refresh-icon">↓</div>
            <div class="pull-refresh-text">下に引っ張って更新</div>
          </div>
          <div id="feedLoading" class="feed-loading">
            <div class="egg-loader small" aria-label="読み込み中">
              <div class="egg-shadow"></div>
              <div class="egg-body">
                <div class="egg-yolk"></div>
              </div>
            </div>
            <div class="feed-loading-text">ゆでたまSNS</div>
          </div>
          <div id="feed" class="feed"></div>
        </section>


        <section id="talkPage" class="page hidden">
          <div id="talkListView">
            <div class="section-head section-card glass compact-sheet talk-section-head">
              <h3>Talk</h3>
              <div class="talk-head-right">
                <span id="talkUnread"></span>
                <button id="talkNotificationSetting" class="talk-notification-bell" type="button" aria-label="端末通知" title="端末通知">
                  <span id="talkNotificationIcon" aria-hidden="true">🔕</span>
                  <span id="talkNotificationStatus" class="sr-only">設定を確認</span>
                </button>
              </div>
            </div>
            <div id="talkList" class="talk-list"></div>
            <div class="talk-start-wrap">
              <button id="newTalkBtn" class="ghost talk-start-btn">＋ 新しいトーク</button>
            </div>
          </div>

          <div id="talkThreadView" class="hidden">
            <div class="talk-thread-head">
              <button id="backTalkList" class="icon-btn" type="button">‹</button>
              <div id="talkPeer" class="talk-peer"></div>
              <div class="talk-head-actions">
                <button id="talkSearchBtn" class="icon-btn" type="button" aria-label="検索">⌕</button>
                <button id="talkSettingsBtn" class="icon-btn" type="button" aria-label="設定">•••</button>
              </div>
            </div>

            <div id="talkSearchBar" class="talk-search-bar hidden">
              <input id="talkSearchInput" type="search" placeholder="トーク内を検索">
              <button id="closeTalkSearch" class="icon-btn" type="button">✕</button>
            </div>

            <button id="pinnedMessageBar" class="pinned-message-bar hidden" type="button">
              <span>📌</span><span id="pinnedMessageText"></span>
            </button>

            <div id="talkMessages" class="talk-messages"></div>

            <div id="typingIndicator" class="typing-indicator hidden">入力中…</div>

            <div id="replyBar" class="reply-bar hidden">
              <div><small>返信</small><div id="replyBarText"></div></div>
              <button id="cancelReply" class="icon-btn" type="button">✕</button>
            </div>

            <form id="talkForm" class="talk-form">
              <input id="talkInput" maxlength="2000" placeholder="メッセージ" autocomplete="off">
              <button class="primary mini" type="submit">送信</button>
            </form>
          </div>
        </section>

        <section id="membersPage" class="page hidden">
          <div class="section-head section-card glass compact-sheet">
            <h3>メンバー</h3>
            <span id="memberCount"></span>
          </div>
          <div id="membersList" class="members"></div>
        </section>

        <section id="profilePage" class="page hidden">
          <div class="profile-card glass compact-sheet">
            <div class="avatar-wrap profile-avatar-wrap">
              <img id="profileAvatar" class="avatar xl" alt="">
              <div id="profileFallback" class="avatar xl fallback">?</div>
            </div>
            <div class="profile-headline">
              <h3>プロフィール</h3>
            </div>
            <label class="file-btn compact">アイコン変更<input id="avatarInput" type="file" accept="image/*" hidden></label>
            <label>
              <span>表示名</span>
              <input id="profileName" maxlength="30">
            </label>
            <label>
              <span>ひとこと</span>
              <textarea id="profileBio" maxlength="160" placeholder="ひとこと紹介"></textarea>
            </label>

            <div class="theme-settings">
              <span class="theme-label">画面テーマ</span>
              <div class="theme-options">
                <button type="button" class="theme-option active" data-theme="light"><span class="sr-only">ライト</span></button>
                <button type="button" class="theme-option" data-theme="dark"><span class="sr-only">ダーク</span></button>
                <button type="button" class="theme-option" data-theme="warm"><span class="sr-only">ウォーム</span></button>
                <button type="button" class="theme-option" data-theme="blue"><span class="sr-only">ブルー</span></button>
              </div>
            </div>

            <button id="saveProfile" class="primary">保存</button>
            <button id="logoutBtn" class="danger ghost">ログアウト</button>
            <p id="profileMsg" class="message"></p>
          </div>
        </section>
      </main>

      <button id="composeFab" class="compose-fab" aria-label="投稿する" title="投稿する">✍️</button>

      <nav class="bottom-nav glass">
        <button data-page="homePage" class="nav-item active"><span>🏠</span><small>ホーム</small></button>
        <button data-page="talkPage" class="nav-item"><span>💬</span><small>Talk</small><b id="talkBadge" class="nav-badge hidden">0</b></button>
        <button data-page="membersPage" class="nav-item"><span>👥</span><small>メンバー</small></button>
        <button data-page="profilePage" class="nav-item"><span>🥹</span><small>Profile</small></button>
      </nav>
    </section>
  </div>




  <dialog id="talkSettingsDialog" class="simple-sheet-dialog">
    <div class="simple-sheet">
      <div class="compose-head">
        <button id="closeTalkSettings" class="compose-close" type="button">✕</button>
        <strong>トーク設定</strong>
        <span></span>
      </div>
      <button id="toggleTalkMute" class="sheet-row" type="button">このトークの通知をオフ</button>
      <button id="deleteTalkFromSettings" class="sheet-row danger-row" type="button">トークを削除</button>
    </div>
  </dialog>

  <dialog id="messageActionsDialog" class="message-context-dialog">
    <div class="message-context-card">
      <div class="reaction-picker" aria-label="リアクション">
        <button type="button" data-reaction="👍">👍</button>
        <button type="button" data-reaction="❤️">❤️</button>
        <button type="button" data-reaction="😂">😂</button>
        <button type="button" data-reaction="😮">😮</button>
        <button type="button" data-reaction="😢">😢</button>
        <button type="button" data-reaction="🙏">🙏</button>
      </div>


      <div class="context-quick-actions">
        <button id="actionCopy" class="quick-action-btn" type="button">
          <span class="quick-action-icon">▣</span>
          <span>コピー</span>
        </button>
        <button id="actionPin" class="quick-action-btn pin-only" type="button" aria-label="ピン留め" title="ピン留め">📌</button>
      </div>
    </div>
  </dialog>

  <dialog id="memberPickerDialog" class="member-picker-dialog">
    <div class="member-picker-sheet">
      <div class="compose-head">
        <button id="closeMemberPicker" class="compose-close" type="button">✕</button>
        <strong>トークする相手</strong>
        <span></span>
      </div>
      <div id="memberPickerList" class="members"></div>
    </div>
  </dialog>

  <dialog id="composeDialog" class="compose-dialog">
    <div class="compose-sheet">
      <div class="compose-head">
        <button id="closeCompose" class="compose-close" type="button">✕</button>
        <strong>新しい投稿</strong>
        <span class="compose-spacer"></span>
      </div>
      <div class="compose-body">
        <textarea id="postBody" maxlength="5000" placeholder="いまどうしてる？"></textarea>
        <div id="postPreview"></div>
        <div class="post-submit-row">
          <label class="file-btn modern-upload post-photo-btn" aria-label="写真を追加" title="写真を追加">📷<input id="postImage" type="file" accept="image/*" hidden></label>
          <button id="submitPost" class="primary post-submit-btn">投稿する</button>
        </div>
        <p id="postMsg" class="message"></p>
      </div>
    </div>
  </dialog>

  <dialog id="commentDialog">
    <form method="dialog" class="dialog-head">
      <strong>コメント</strong>
      <button>✕</button>
    </form>
    <div id="commentsList"></div>
    <form id="commentForm" class="comment-form">
      <input id="commentInput" placeholder="コメントを書く" maxlength="2000">
      <button class="primary mini">送信</button>
    </form>
  </dialog>

  <script src="app.js?v=44"></script>
</body>
</html>
