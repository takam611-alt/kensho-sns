<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Kensho SNS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="authView" class="auth-wrap">
      <div class="brand">
        <div class="brand-mark">K</div>
        <h1>Kensho SNS</h1>
        <p>招待メンバーだけのSNS</p>
      </div>

      <div class="auth-card">
        <div class="segmented">
          <button id="loginTab" class="active">ログイン</button>
          <button id="registerTab">新規登録</button>
        </div>

        <form id="loginForm" class="form">
          <label>名前<input id="loginName" autocomplete="username" maxlength="30" required></label>
          <label>4桁PIN<input id="loginPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" type="password" required></label>
          <button class="primary" type="submit">ログイン</button>
        </form>

        <form id="registerForm" class="form hidden">
          <label>招待コード<input id="inviteCode" autocomplete="off" required></label>
          <label>表示名<input id="registerName" maxlength="30" required></label>
          <label>4桁PIN<input id="registerPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" type="password" required></label>
          <button class="primary" type="submit">登録してはじめる</button>
        </form>
        <p id="authMsg" class="message"></p>
      </div>
    </section>

    <section id="mainView" class="hidden">
      <header class="topbar">
        <div>
          <div class="eyebrow">招待制コミュニティ</div>
          <h2>Kensho SNS</h2>
        </div>
        <button id="refreshBtn" class="icon-btn" aria-label="更新">↻</button>
      </header>

      <main>
        <section id="homePage" class="page">
          <div id="feed" class="feed"></div>
        </section>

        <section id="postPage" class="page hidden">
          <div class="sheet">
            <h3>新しい投稿</h3>
            <div class="chips">
              <button data-type="normal" class="chip active">ふつう</button>
              <button data-type="kensho" class="chip">懸賞</button>
              <button data-type="win" class="chip">当選報告</button>
              <button data-type="poll" class="chip">アンケート</button>
            </div>
            <textarea id="postBody" maxlength="5000" placeholder="みんなに共有しよう"></textarea>
            <label class="file-btn">📷 写真を追加<input id="postImage" type="file" accept="image/*" hidden></label>
            <div id="postPreview"></div>
            <button id="submitPost" class="primary">投稿する</button>
            <p id="postMsg" class="message"></p>
          </div>
        </section>

        <section id="membersPage" class="page hidden">
          <div class="section-head"><h3>メンバー</h3><span id="memberCount"></span></div>
          <div id="membersList" class="members"></div>
        </section>

        <section id="profilePage" class="page hidden">
          <div class="profile-card">
            <div class="avatar-wrap">
              <img id="profileAvatar" class="avatar xl" alt="">
              <div id="profileFallback" class="avatar xl fallback">?</div>
            </div>
            <label class="file-btn compact">アイコン変更<input id="avatarInput" type="file" accept="image/*" hidden></label>
            <label>表示名<input id="profileName" maxlength="30"></label>
            <label>ひとこと<textarea id="profileBio" maxlength="160"></textarea></label>
            <button id="saveProfile" class="primary">保存</button>
            <button id="logoutBtn" class="danger ghost">ログアウト</button>
            <p id="profileMsg" class="message"></p>
          </div>
        </section>
      </main>

      <nav class="bottom-nav">
        <button data-page="homePage" class="nav-item active"><span>⌂</span><small>ホーム</small></button>
        <button data-page="postPage" class="nav-item"><span>＋</span><small>投稿</small></button>
        <button data-page="membersPage" class="nav-item"><span>◎</span><small>メンバー</small></button>
        <button data-page="profilePage" class="nav-item"><span>◯</span><small>マイ</small></button>
      </nav>
    </section>
  </div>

  <dialog id="commentDialog">
    <form method="dialog" class="dialog-head">
      <strong>コメント</strong>
      <button>✕</button>
    </form>
    <div id="commentsList"></div>
    <form id="commentForm" class="comment-form">
      <input id="commentInput" placeholder="コメントを書く" maxlength="2000">
      <button class="primary mini">送信</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
